services:
  imal-monitor:
    build:
      context: .
      dockerfile: Dockerfile

    image: imal-monitor:1.0.0
    container_name: imal-monitor

    restart: unless-stopped

    ports:
      - "8700:8700"

    env_file:
      - .env

    environment:
      TZ: Africa/Nairobi

    volumes:
      - ./config:/app/config:ro,Z
      - ./keys/monitoring_ed25519_docker:/run/secrets/monitoring_ed25519:ro,Z
      - ./keys/known_hosts:/run/secrets/known_hosts:ro,Z

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s